<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💎 Jewel Blast</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      /* Dynamic sizing for a web app: the board is scaled to fill the
        available screen space by board-fit.js, which measures the real
        free space (screen minus title/HUD/footer) and writes the result back
        into these custom properties. These are sane fallbacks used on the very
        first paint before the script runs. */
      --cell: 64px;
      --gap: clamp(3px, 1vw, 8px);
      /* Neon synthwave palette */
      --neon-pink: #ff3ea5;
      --neon-cyan: #4dd0ff;
      --neon-yellow: #ffd24d;
      --neon-green: #8bff5a;
      --neon-purple: #b473ff;
      --neon-orange: #ff9f45;
      --grid-line: rgba(120, 60, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      font-family: 'Press Start 2P', system-ui, 'Courier New', monospace;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    body {
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 0%, #4a2c8f 0%, #14082b 100%),
        linear-gradient(180deg, #1a1030, #0d0620 70%);
      color: #fff;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 40vw;
      height: 40vh;
      background: radial-gradient(circle, var(--neon-pink) 0%, transparent 70%);
      filter: blur(50px);
      opacity: 0.4;
      z-index: -1;
    }

    body::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px);
      background-size: 40px 40px;
      transform: perspective(500px) rotateX(60deg);
      transform-origin: center bottom;
      bottom: 0;
      opacity: 0.2;
      z-index: -2;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.1) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 100;
      opacity: 0.1;
    }

    /* ---- Desktop-first layout -------------------------------------
        Default (wide / landscape): a glass side panel of title + stats +
        controls sits beside a large centered board, filling the width like
        a desktop game. On narrow / portrait screens it collapses to the
        compact vertical stack. board-fit.js sizes the board to fill the
        region left by the panel. */
    .app {
      width: 100%;
      height: 100%;
      display: grid;
      gap: 20px;
      /* [ side panel | board region ] */
      grid-template-columns: clamp(230px, 22vw, 340px) minmax(0, 1fr);
      grid-template-rows: 1fr;
      align-items: stretch;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
      justify-content: center;
      align-self: center;
      padding: 22px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 25px rgba(180, 115, 255, 0.18), inset 0 0 18px rgba(180, 115, 255, 0.10);
    }

    .board-area {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
    }

    /* Narrow / portrait: stack the panel above the board. */
    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        gap: 14px;
        align-content: center;
      }

      .panel {
        align-items: center;
        gap: 12px;
        padding: 16px;
      }

      .hud {
        width: 100%;
        max-width: 420px;
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    .title {
      text-align: center;
      font-weight: 800;
      letter-spacing: 1px;
      font-size: clamp(26px, 7vw, 40px);
      color: #fff;
      text-shadow: 0 0 15px var(--neon-pink), 0 0 30px var(--neon-purple);
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      opacity: 0.8;
      margin-top: -6px;
      letter-spacing: 0.5px;
      color: var(--neon-cyan);
    }

    .title::before {
      content: "🐾 ";
    }

    .subtitle {
      content: "Match 3 or more cats · beat the clock";
      display: block;
    }

    .title::before {
      content: "🐾 ";
    }

    .subtitle {
      content: "Match 3 or more cats · beat the clock";
      display: block;
    }

    .hud {
      display: grid;
      /* Desktop side panel: stack the stat cards vertically. */
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 10px 8px;
      text-align: center;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.05), inset 0 0 5px rgba(255, 255, 255, 0.1);
    }

    .stat .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      opacity: 0.7;
      color: #fff;
    }

    .stat .value {
      font-size: 22px;
      font-weight: 800;
      margin-top: 2px;
      line-height: 1;
    }

    #timer.value {
      color: var(--neon-yellow);
      text-shadow: 0 0 8px var(--neon-yellow);
    }

    #moves.value {
      color: var(--neon-cyan);
      text-shadow: 0 0 8px var(--neon-cyan);
    }

    #score.value {
      color: var(--neon-green);
      text-shadow: 0 0 8px var(--neon-green);
    }

    .board-wrap {
      position: relative;
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid var(--neon-purple);
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 0 25px rgba(180, 115, 255, 0.3), inset 0 0 15px rgba(180, 115, 255, 0.2);
      overflow: hidden;
    }

    #board {
      position: relative;
      display: grid;
      gap: var(--gap);
      touch-action: none;
      background: rgba(10, 5, 20, 0.8);
      border-radius: 12px;
      justify-content: center;
      max-width: 100%;
    }

    .cell {
      position: relative;
      width: var(--cell);
      height: var(--cell);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .gem {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--cell) * 0.62);
      cursor: pointer;
      transition: transform 0.16s cubic-bezier(.3, 1.5, .5, 1), filter 0.12s;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
      will-change: transform;
    }

    .gem:hover {
      transform: scale(1.06);
    }

    .gem:active {
      transform: scale(0.92);
    }

    .gem img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    /* Special gems */
    .special {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.85), 0 0 18px rgba(255, 255, 255, 0.7), inset 0 0 12px rgba(255, 255, 255, 0.6);
    }

    .special::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid #00f2ff;
      box-shadow: 0 0 15px #00f2ff, inset 0 0 5px #00f2ff;
      animation: pulse 0.8s infinite alternate;
    }

    .bomb-special::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid #ff9f45;
      box-shadow: 0 0 15px #ff9f45, inset 0 0 5px #ff9f45;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      from {
        transform: scale(0.9);
      }

      to {
        transform: scale(1.15);
      }
    }

    .selected {
      outline: 3px solid #fff;
      outline-offset: -3px;
      transform: scale(1.08);
      z-index: 5;
    }

    /* Animations */
    .fall {
      animation: fall 0.28s ease-in;
    }

    @keyframes fall {
      from {
        transform: translateY(-40px);
        opacity: 0.4;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .pop {
      animation: pop 0.24s ease forwards;
      pointer-events: none;
    }

    @keyframes pop {
      0% {
        transform: scale(1);
      }

      40% {
        transform: scale(1.35);
        filter: brightness(2);
      }

      100% {
        transform: scale(0);
        opacity: 0;
      }
    }

    .hint {
      animation: hint 0.6s infinite alternate;
    }

    @keyframes hint {
      from {
        filter: brightness(1);
      }

      to {
        filter: brightness(1.8);
      }
    }

    .shake-fail {
      animation: shake 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20%,
      80% {
        transform: translateX(-10px);
      }

      40%,
      60% {
        transform: translateX(10px);
      }
    }

    /* Start / end overlay that sits on top of the board */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      background: rgba(13, 6, 32, 0.82);
      backdrop-filter: blur(4px);
      border-radius: 14px;
      z-index: 20;
    }

    .overlay h2 {
      font-size: clamp(16px, 4.5vw, 22px);
      color: #fff;
      text-shadow: 0 0 12px var(--neon-pink), 0 0 24px var(--neon-purple);
      line-height: 1.4;
    }

    .overlay p {
      font-size: 12px;
      line-height: 1.6;
      opacity: 0.85;
      max-width: 300px;
    }

    .overlay .final-score {
      font-size: 28px;
      font-weight: 800;
      color: var(--neon-green);
      text-shadow: 0 0 10px var(--neon-green);
    }

    .overlay button,
    .footer button {
      font-family: inherit;
      font-size: 14px;
      color: #fff;
      cursor: pointer;
      padding: 12px 20px;
      border: 2px solid var(--neon-cyan);
      border-radius: 12px;
      background: rgba(77, 208, 255, 0.12);
      box-shadow: 0 0 14px rgba(77, 208, 255, 0.4);
      transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
    }

    .overlay button:hover,
    .footer button:hover {
      transform: scale(1.05);
      background: rgba(77, 208, 255, 0.25);
      box-shadow: 0 0 20px rgba(77, 208, 255, 0.6);
    }

    .overlay button:active {
      transform: scale(0.96);
    }

    /* Floating score popups */
    .popup {
      position: absolute;
      font-size: 16px;
      font-weight: 800;
      color: var(--neon-yellow);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      animation: floatUp 0.7s ease forwards;
      z-index: 15;
      pointer-events: none;
    }

    /* Footer row — horizontal on mobile, stacked under the stats in the
        desktop side panel. */
    .footer {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
      opacity: 0.85;
    }

    @media (min-width: 821px) {
      .footer {
        flex-direction: column;
        align-items: center;
      }
    }

    /* Universal hide helper */
    .hidden {
      display: none !important;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0);
        opacity: 1;
      }

      to {
        transform: translateY(-34px);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="panel">
      <h1 class="title">💎 Jewel Blast</h1>
      <p class="subtitle">Match 3 or more jewels · beat the clock</p>

      <div class="hud">
        <div class="stat">
          <div class="label">Score</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="stat">
          <div class="label">Moves</div>
          <div class="value" id="moves">20</div>
        </div>
        <div class="stat">
          <div class="label">Time</div>
          <div class="value" id="timer">60</div>
        </div>
      </div>

      <div class="footer">
        <span id="hint-msg">Tip: match 4 for a line blaster 🐾</span>
        <button id="restart-btn">↻ Reset</button>
      </div>
    </div>

    <div class="board-area">
      <div class="board-wrap">
        <div id="board"></div>
        <div class="overlay" id="overlay">
          <h2 id="ov-title">Ready for the Neon?</h2>
          <p id="ov-text">Swap neighboring cats to line up 3 or more of the same color. Bigger matches and chains score
            big!</p>
          <div class="final-score hidden" id="final-score">0</div>
          <button id="start-btn">▶ Start</button>
        </div>
      </div>
    </div>

    <script src="board-fit.js"></script>
    <script src="game.js"></script>
</body>

</html>
